<!doctype html><html><body style="margin:0;background:transparent">
<!-- Same recipe as XynMacro's icon: dark graphite tile, brushed-silver mark with a soft bevel shadow. -->
<div style="width:1024px;height:1024px;border-radius:224px;background:linear-gradient(160deg,#23252c,#0e0f13 70%);display:grid;place-items:center;box-shadow:inset 0 0 0 6px #ffffff10">
<div style="filter:drop-shadow(0 18px 22px rgba(0,0,0,.55)) drop-shadow(-4px -4px 0 rgba(255,255,255,.08))">
<div style="width:700px;height:700px;background:linear-gradient(160deg,#ffffff 0%,#d9dde4 30%,#9aa1ad 62%,#5f6570 100%);-webkit-mask:url(xl-mark.svg) center/contain no-repeat"></div>
</div></div></body></html>
